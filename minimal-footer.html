<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern Minimal Footer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .footer {
      padding: 80px 20px 30px;
      border-top: 1px solid #29292f;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .footer-top {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 50px;
      padding-bottom: 60px;
    }

    .brand h2 {
      font-size: 25px;
      margin-bottom: 15px;
    }

    .brand p {
      max-width: 300px;
      color: #777;
      font-size: 14px;
      line-height: 1.7;
    }

    .column h3 {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .column {
      display: flex;
      flex-direction: column;
    }

    .column a {
      color: #777;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 11px;
    }

    .column a:hover {
      color: #fff;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 25px;
      border-top: 1px solid #29292f;
      color: #666;
      font-size: 12px;
    }

    .socials {
      display: flex;
      gap: 15px;
    }

    .socials a {
      color: #777;
      text-decoration: none;
    }

    @media (max-width: 750px) {
      .footer {
        padding: 60px 16px 25px;
      }

      .footer-top {
        grid-template-columns: 1fr 1fr;
        gap: 40px 25px;
      }

      .brand {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 450px) {
      .footer-top {
        grid-template-columns: 1fr 1fr;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <footer class="footer">

    <div class="container">

      <div class="footer-top">

        <div class="brand">

          <h2>Nova.</h2>

          <p>
            Building simple digital experiences for
            ambitious people and modern businesses.
          </p>

        </div>


        <div class="column">

          <h3>PRODUCT</h3>

          <a href="#">Features</a>
          <a href="#">Pricing</a>
          <a href="#">Changelog</a>
          <a href="#">Roadmap</a>

        </div>


        <div class="column">

          <h3>COMPANY</h3>

          <a href="#">About</a>
          <a href="#">Careers</a>
          <a href="#">Contact</a>
          <a href="#">Blog</a>

        </div>


        <div class="column">

          <h3>LEGAL</h3>

          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">License</a>
          <a href="#">Cookies</a>

        </div>

      </div>


      <div class="footer-bottom">

        <div>
          © 2026 Nova. All rights reserved.
        </div>

        <div class="socials">
          <a href="#">Instagram</a>
          <a href="#">X</a>
          <a href="#">LinkedIn</a>
        </div>

      </div>

    </div>

  </footer>

</body>
  </html>

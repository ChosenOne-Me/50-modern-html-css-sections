<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern Logo Stats Section</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .section {
      padding: 100px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .heading {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 55px;
    }

    .heading span {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .heading h1 {
      font-size: clamp(40px, 6vw, 60px);
      line-height: 1.05;
      margin: 15px 0;
    }

    .heading p {
      color: #888;
      font-size: 17px;
      line-height: 1.6;
    }

    .logos {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border: 1px solid #29292f;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .logo {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-weight: bold;
      font-size: 15px;
      border-right: 1px solid #29292f;
    }

    .logo:last-child {
      border-right: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #29292f;
      border: 1px solid #29292f;
      border-radius: 18px;
      overflow: hidden;
    }

    .stat {
      padding: 35px 20px;
      text-align: center;
      background: #111116;
    }

    .stat strong {
      display: block;
      font-size: 35px;
      margin-bottom: 7px;
    }

    .stat span {
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .section {
        padding: 70px 16px;
      }

      .logos {
        grid-template-columns: repeat(2, 1fr);
      }

      .logo {
        border-right: 1px solid #29292f;
        border-bottom: 1px solid #29292f;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      .logos {
        grid-template-columns: 1fr 1fr;
      }

      .logo {
        min-height: 80px;
        font-size: 13px;
      }

      .stat strong {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <section class="section">

    <div class="container">

      <div class="heading">

        <span>TRUSTED & PROVEN</span>

        <h1>
          Numbers That Speak.
        </h1>

        <p>
          Combine recognizable brands with meaningful
          statistics to build credibility and trust.
        </p>

      </div>


      <div class="logos">

        <div class="logo">NOVA</div>

        <div class="logo">VERTEX</div>

        <div class="logo">LUMEN</div>

        <div class="logo">ORBIT</div>

        <div class="logo">ATLAS</div>

      </div>


      <div class="stats">

        <div class="stat">
          <strong>10K+</strong>
          <span>Active Customers</span>
        </div>

        <div class="stat">
          <strong>98%</strong>
          <span>Customer Satisfaction</span>
        </div>

        <div class="stat">
          <strong>42</strong>
          <span>Countries Reached</span>
        </div>

        <div class="stat">
          <strong>5M+</strong>
          <span>Projects Completed</span>
        </div>

      </div>

    </div>

  </section>

</body>
          </html>

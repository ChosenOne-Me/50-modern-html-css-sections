<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Final CTA Banner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .section {
      padding: 100px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .cta {
      position: relative;
      overflow: hidden;
      padding: 90px 50px;
      text-align: center;
      background: #15151b;
      border: 1px solid #444;
      border-radius: 30px;
    }

    .circle {
      position: absolute;
      width: 450px;
      height: 450px;
      border: 1px solid #29292f;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .circle::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border: 1px solid #29292f;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 750px;
      margin: auto;
    }

    .label {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1;
      margin-bottom: 22px;
    }

    .description {
      max-width: 600px;
      margin: 0 auto 35px;
      color: #888;
      font-size: 17px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      padding: 15px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .primary {
      background: #fff;
      color: #000;
    }

    .secondary {
      color: #fff;
      border: 1px solid #444;
    }

    .note {
      margin-top: 22px;
      color: #555;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .section {
        padding: 70px 16px;
      }

      .cta {
        padding: 65px 22px;
      }

      .circle {
        width: 330px;
        height: 330px;
      }

      .circle::before {
        width: 220px;
        height: 220px;
      }

      .buttons {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="section">

    <div class="container">

      <div class="cta">

        <div class="circle"></div>

        <div class="content">

          <div class="label">
            YOUR NEXT MOVE
          </div>

          <h1>
            Ready To Build Something Great?
          </h1>

          <p class="description">
            Take the next step and turn your idea into
            something people will remember.
          </p>

          <div class="buttons">

            <a href="#" class="button primary">
              Get Started →
            </a>

            <a href="#" class="button secondary">
              Contact Us
            </a>

          </div>

          <div class="note">
            Let's create something meaningful together.
          </div>

        </div>

      </div>

    </div>

  </section>

</body>
</html>

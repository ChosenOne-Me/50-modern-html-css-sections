<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dark Newsletter CTA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .newsletter {
      padding: 100px 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .newsletter-card {
      position: relative;
      overflow: hidden;
      padding: 70px 50px;
      text-align: center;
      background: #111116;
      border: 1px solid #333;
      border-radius: 28px;
    }

    .newsletter-card::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      left: 50%;
      top: -300px;
      transform: translateX(-50%);
      border: 1px solid #29292f;
      border-radius: 50%;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: auto;
    }

    .label {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(40px, 6vw, 62px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .description {
      color: #888;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    form {
      display: flex;
      max-width: 520px;
      margin: auto;
      padding: 5px;
      background: #0b0b0f;
      border: 1px solid #333;
      border-radius: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 15px;
      border: none;
      outline: none;
      background: transparent;
      color: #fff;
      font-size: 14px;
    }

    input::placeholder {
      color: #555;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      color: #555;
      font-size: 11px;
      margin-top: 17px;
    }

    @media (max-width: 600px) {
      .newsletter {
        padding: 70px 16px;
      }

      .newsletter-card {
        padding: 50px 22px;
      }

      form {
        flex-direction: column;
        gap: 8px;
        padding: 8px;
      }

      input {
        width: 100%;
        padding: 14px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="newsletter">

    <div class="container">

      <div class="newsletter-card">

        <div class="content">

          <div class="label">
            STAY IN THE LOOP
          </div>

          <h1>
            Get Better Ideas In Your Inbox.
          </h1>

          <p class="description">
            Join our newsletter for useful insights,
            product updates and fresh ideas. No spam.
          </p>

          <form onsubmit="subscribe(event)">

            <input
              type="email"
              placeholder="Enter your email address"
              required
            >

            <button type="submit">
              Subscribe →
            </button>

          </form>

          <div class="note">
            By subscribing, you agree to receive our emails.
          </div>

        </div>

      </div>

    </div>

  </section>

  <script>
    function subscribe(event) {
      event.preventDefault();

      const email = event.target.querySelector("input").value;

      alert("Thanks! " + email + " has been added.");
    }
  </script>

</body>
  </html>

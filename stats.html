<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Stats Section</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .stats-section {
      padding: 100px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .heading {
      max-width: 650px;
      margin: 0 auto 55px;
      text-align: center;
    }

    .heading span {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .heading h1 {
      font-size: clamp(40px, 6vw, 60px);
      margin: 15px 0;
    }

    .heading p {
      color: #888;
      line-height: 1.6;
      font-size: 17px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #29292f;
      border-left: 1px solid #29292f;
    }

    .stat {
      padding: 45px 25px;
      text-align: center;
      border-right: 1px solid #29292f;
      border-bottom: 1px solid #29292f;
      background: #111116;
    }

    .number {
      font-size: clamp(40px, 5vw, 58px);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .label {
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats-section {
        padding: 70px 16px;
      }
    }

    @media (max-width: 450px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <section class="stats-section">

    <div class="container">

      <div class="heading">

        <span>OUR NUMBERS</span>

        <h1>Results That Matter.</h1>

        <p>
          Highlight important achievements, milestones
          and business metrics with a clean statistics section.
        </p>

      </div>

      <div class="stats-grid">

        <div class="stat">
          <div class="number">250+</div>
          <div class="label">Projects Completed</div>
        </div>

        <div class="stat">
          <div class="number">120K</div>
          <div class="label">Happy Customers</div>
        </div>

        <div class="stat">
          <div class="number">98%</div>
          <div class="label">Customer Satisfaction</div>
        </div>

        <div class="stat">
          <div class="number">12+</div>
          <div class="label">Years Experience</div>
        </div>

      </div>

    </div>

  </section>

</body>
</html>

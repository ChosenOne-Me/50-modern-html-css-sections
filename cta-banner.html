<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern CTA Banner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .cta {
      padding: 100px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .cta-box {
      position: relative;
      overflow: hidden;
      padding: 75px 60px;
      text-align: center;
      background: #15151b;
      border: 1px solid #333;
      border-radius: 28px;
    }

    .cta-box::before,
    .cta-box::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border: 1px solid #29292f;
      border-radius: 50%;
      pointer-events: none;
    }

    .cta-box::before {
      left: -130px;
      top: -130px;
    }

    .cta-box::after {
      right: -130px;
      bottom: -130px;
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 750px;
      margin: auto;
    }

    .label {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(40px, 7vw, 68px);
      line-height: 1.03;
      margin-bottom: 20px;
    }

    .description {
      max-width: 600px;
      margin: 0 auto 32px;
      color: #888;
      font-size: 17px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 15px 23px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .primary {
      background: #fff;
      color: #000;
    }

    .secondary {
      border: 1px solid #444;
      color: #fff;
    }

    .note {
      margin-top: 20px;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .cta {
        padding: 70px 16px;
      }

      .cta-box {
        padding: 55px 22px;
      }

      .buttons {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="cta">

    <div class="container">

      <div class="cta-box">

        <div class="content">

          <div class="label">
            READY WHEN YOU ARE
          </div>

          <h1>
            Let's Build Something Great.
          </h1>

          <p class="description">
            Turn your idea into a polished digital experience
            with a simple, focused and modern approach.
          </p>

          <div class="buttons">

            <a href="#" class="button primary">
              Get Started →
            </a>

            <a href="#" class="button secondary">
              Talk To Us
            </a>

          </div>

          <div class="note">
            No commitment required.
          </div>

        </div>

      </div>

    </div>

  </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern App Download Section</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .app-section {
      padding: 100px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .app-card {
      display: grid;
      grid-template-columns: 1fr 0.8fr;
      gap: 60px;
      align-items: center;
      padding: 65px;
      overflow: hidden;
      background: #111116;
      border: 1px solid #29292f;
      border-radius: 28px;
    }

    .label {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(40px, 6vw, 65px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .description {
      color: #888;
      font-size: 17px;
      line-height: 1.7;
      max-width: 580px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .store {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 170px;
      padding: 13px 17px;
      border: 1px solid #444;
      border-radius: 11px;
      color: #fff;
      text-decoration: none;
    }

    .store-icon {
      font-size: 22px;
    }

    .store small {
      display: block;
      color: #777;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .store strong {
      font-size: 14px;
    }

    .phone-area {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 220px;
      height: 430px;
      padding: 10px;
      background: #050507;
      border: 2px solid #444;
      border-radius: 32px;
      transform: rotate(3deg);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .screen {
      height: 100%;
      padding: 20px 15px;
      background: #1a1a20;
      border-radius: 23px;
    }

    .notch {
      width: 70px;
      height: 12px;
      margin: 0 auto 30px;
      background: #333;
      border-radius: 20px;
    }

    .screen-title {
      width: 110px;
      height: 15px;
      background: #ddd;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .line {
      width: 100%;
      height: 8px;
      background: #444;
      border-radius: 5px;
      margin-bottom: 8px;
    }

    .screen-box {
      height: 130px;
      margin-top: 25px;
      background: #29292f;
      border-radius: 15px;
    }

    @media (max-width: 800px) {
      .app-section {
        padding: 70px 16px;
      }

      .app-card {
        grid-template-columns: 1fr;
        gap: 50px;
        padding: 40px 25px;
      }

      .phone {
        width: 190px;
        height: 370px;
      }
    }

    @media (max-width: 450px) {
      .buttons {
        flex-direction: column;
      }

      .store {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="app-section">

    <div class="container">

      <div class="app-card">

        <div class="content">

          <div class="label">
            AVAILABLE EVERYWHERE
          </div>

          <h1>
            Your Product. In Your Pocket.
          </h1>

          <p class="description">
            Give users a simple way to discover your mobile
            app and download it directly from their preferred
            app store.
          </p>

          <div class="buttons">

            <a href="#" class="store">

              <div class="store-icon">●</div>

              <div>
                <small>DOWNLOAD ON THE</small>
                <strong>App Store</strong>
              </div>

            </a>

            <a href="#" class="store">

              <div class="store-icon">▶</div>

              <div>
                <small>GET IT ON</small>
                <strong>Google Play</strong>
              </div>

            </a>

          </div>

        </div>

        <div class="phone-area">

          <div class="phone">

            <div class="screen">

              <div class="notch"></div>

              <div class="screen-title"></div>

              <div class="line"></div>
              <div class="line"></div>
              <div class="line"></div>

              <div class="screen-box"></div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </section>

</body>
</html>

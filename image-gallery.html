<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern Image Gallery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .gallery-section {
      padding: 100px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .heading {
      max-width: 700px;
      margin: 0 auto 50px;
      text-align: center;
    }

    .heading span {
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .heading h1 {
      font-size: clamp(40px, 6vw, 60px);
      line-height: 1.05;
      margin: 15px 0;
    }

    .heading p {
      color: #888;
      font-size: 17px;
      line-height: 1.6;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 220px;
      gap: 15px;
    }

    .item {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17171d;
      border: 1px solid #29292f;
      border-radius: 18px;
      color: #666;
      font-size: 13px;
    }

    .item.large {
      grid-row: span 2;
    }

    .item.wide {
      grid-column: span 2;
    }

    .item span {
      position: absolute;
      left: 18px;
      bottom: 16px;
      padding: 7px 10px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #444;
      border-radius: 7px;
      color: #aaa;
      font-size: 11px;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at 30% 30%,
          #29292f,
          transparent 55%
        );
      opacity: .8;
    }

    .item > * {
      z-index: 1;
    }

    @media (max-width: 750px) {
      .gallery-section {
        padding: 70px 16px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 180px;
      }

      .item.large {
        grid-row: span 2;
      }

      .item.wide {
        grid-column: span 2;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
        grid-auto-rows: 220px;
      }

      .item.large,
      .item.wide {
        grid-column: span 1;
        grid-row: span 1;
      }
    }
  </style>
</head>

<body>

  <section class="gallery-section">

    <div class="container">

      <div class="heading">

        <span>OUR WORK</span>

        <h1>
          A Visual Collection.
        </h1>

        <p>
          Showcase photography, products, projects or
          creative work with a flexible responsive gallery.
        </p>

      </div>


      <div class="gallery">

        <div class="item large">
          IMAGE 01
          <span>Architecture</span>
        </div>

        <div class="item">
          IMAGE 02
          <span>Product</span>
        </div>

        <div class="item">
          IMAGE 03
          <span>Creative</span>
        </div>

        <div class="item wide">
          IMAGE 04
          <span>Studio Project</span>
        </div>

        <div class="item">
          IMAGE 05
          <span>Branding</span>
        </div>

        <div class="item">
          IMAGE 06
          <span>Editorial</span>
        </div>

        <div class="item wide">
          IMAGE 07
          <span>Featured Work</span>
        </div>

      </div>

    </div>

  </section>

</body>
</html>

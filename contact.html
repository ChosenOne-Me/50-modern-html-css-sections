<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modern Contact Section</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .contact {
      padding: 100px 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 60px;
      align-items: start;
    }

    .label {
      color: #999;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(40px, 6vw, 65px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .intro {
      color: #999;
      line-height: 1.7;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .info-item {
      padding: 20px;
      background: #111116;
      border: 1px solid #29292f;
      border-radius: 14px;
    }

    .info-item strong {
      display: block;
      margin-bottom: 7px;
    }

    .info-item span {
      color: #888;
      font-size: 14px;
    }

    .form {
      padding: 35px;
      background: #111116;
      border: 1px solid #29292f;
      border-radius: 20px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #0b0b0f;
      color: white;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #777;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .contact {
        padding: 70px 16px;
      }

      .form {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <section class="contact">

    <div class="container">

      <div class="contact-grid">

        <div>

          <div class="label">
            CONTACT
          </div>

          <h1>
            Let's Talk.
          </h1>

          <p class="intro">
            Have a question, project idea or something
            you'd like to discuss? Send us a message.
          </p>

          <div class="info">

            <div class="info-item">
              <strong>Email</strong>
              <span>hello@example.com</span>
            </div>

            <div class="info-item">
              <strong>Location</strong>
              <span>New York, USA</span>
            </div>

          </div>

        </div>


        <form class="form">

          <div class="field">
            <label for="name">Name</label>

            <input
              type="text"
              id="name"
              placeholder="Your name"
            >
          </div>

          <div class="field">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              placeholder="you@example.com"
            >
          </div>

          <div class="field">
            <label for="message">Message</label>

            <textarea
              id="message"
              placeholder="Tell us about your project..."
            ></textarea>
          </div>

          <button type="submit">
            Send Message →
          </button>

        </form>

      </div>

    </div>

  </section>

</body>
            </html>
